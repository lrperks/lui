name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config lua5.3 liblua5.3-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev \
            xvfb fonts-dejavu-core

      - name: Cache raylib
        id: raylib
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: raylib-5.5-ubuntu-24.04

      - name: Build raylib
        if: steps.raylib.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          cmake -S /tmp/raylib -B /tmp/raylib/build -DBUILD_EXAMPLES=OFF -DCMAKE_INSTALL_PREFIX="$HOME/.local"
          cmake --build /tmp/raylib/build -j
          cmake --install /tmp/raylib/build

      - name: Build
        run: make -j

      - name: Test
        run: make test

      - name: Render every example
        run: |
          mkdir -p shots
          for f in examples/*.lui; do
            name=$(basename "$f" .lui)
            # raylib saves screenshots in the working directory, so run from shots/
            (cd shots && LUI_SHOT="$name.png" LUI_SHOT_FRAMES=30 \
              xvfb-run -a -s "-screen 0 1280x1024x24" ../bin/lui run "../$f" 2> "$name.log")
            test -f "shots/$name.png" || { echo "$name: no screenshot"; cat "shots/$name.log"; exit 1; }
            if grep -q '^lui:' "shots/$name.log"; then cat "shots/$name.log"; exit 1; fi
          done

      - name: Install
        run: |
          ./install.sh --no-deps --prefix "$RUNNER_TEMP/lui"
          "$RUNNER_TEMP/lui/bin/lui" version

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
